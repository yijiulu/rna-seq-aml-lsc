name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install lightweight R test dependency
        run: Rscript -e "install.packages('data.table')"

      - name: Check Python and shell syntax
        run: |
          python -m py_compile scripts/*.py tests/*.py
          bash -n scripts/*.sh

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Run R utility and syntax unit tests
        run: Rscript tests/test_r_utils.R
